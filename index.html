<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel 手書き用変換</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Hiragino Sans', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 { font-size: 20px; color: #1a202c; margin-bottom: 8px; }

    .desc {
      color: #718096;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      background: #ebf8ff;
      color: #2b6cb0;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 48px 24px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f7fafc;
      position: relative;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: #4299e1;
      background: #ebf8ff;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone .icon { font-size: 52px; margin-bottom: 14px; }
    .drop-zone .label { color: #4a5568; font-size: 15px; font-weight: 500; }
    .drop-zone .hint  { color: #a0aec0; font-size: 13px; margin-top: 6px; }

    .file-name {
      margin-top: 12px;
      font-size: 14px;
      color: #2b6cb0;
      font-weight: 500;
      min-height: 22px;
      word-break: break-all;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: #4299e1;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover    { background: #3182ce; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .info-box {
      margin-top: 24px;
      background: #f7fafc;
      border-radius: 10px;
      padding: 14px 16px;
      text-align: left;
      font-size: 13px;
      color: #4a5568;
      line-height: 1.8;
    }

    .info-box strong { color: #2d3748; }

    .error {
      margin-top: 12px;
      color: #e53e3e;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="badge">自動 A4 フィット</div>
  <h1>Excel 手書き用変換</h1>
  <p class="desc">
    アップロードするだけで、セルのサイズを<br>
    <strong>A4用紙いっぱい</strong>になるよう自動で調整します。<br>
    レイアウトや構成はそのまま維持されます。
  </p>

  <div class="drop-zone" id="dropZone">
    <input type="file" id="fileInput" accept=".xlsx,.xlsm">
    <div class="icon">📊</div>
    <div class="label">クリックまたはドラッグ＆ドロップ</div>
    <div class="hint">.xlsx ファイルに対応</div>
  </div>
  <div class="file-name" id="fileName"></div>

  <button class="btn" id="submitBtn" disabled>A4サイズに変換してダウンロード</button>
  <div class="error" id="errorMsg"></div>

  <div class="info-box">
    <strong>自動で行うこと</strong><br>
    ・縦横の比率を維持したままセルを拡大<br>
    ・縦長なら縦向き、横長なら横向きを自動選択<br>
    ・用紙サイズを A4 に設定<br>
    ・ファイル名に「_手書き用」を追加して保存
  </div>
</div>

<script>
// ── 定数 ────────────────────────────────────────────────────────────
const MARGIN_CM       = 0.5;
const A4_W_CM         = 21.0 - 2 * MARGIN_CM;   // 20.0 cm
const A4_H_CM         = 29.7 - 2 * MARGIN_CM;   // 28.7 cm
const DPI             = 96.0;
const PX_PER_COL_UNIT = 64.0 / 8.43;            // ≈ 7.59
const PX_PER_ROW_PT   = DPI / 72.0;             // ≈ 1.333
const DEFAULT_COL_W   = 8.43;
const DEFAULT_ROW_H   = 15.0;
const TIME_COLS       = new Set([14,15,16,17,18,19,20,21]); // N-U
const TIME_BOOST      = 1.5;
const DATE_BOOST      = 1.5;
const OVERSHOOT       = 1.10;
const CELLS_TO_CLEAR  = [
  'V43','Z43','AE43','AH43','AK43','AN43','AQ43','AT43','AW43',
  'BH43','BH44','AZ46'
];

// ── 変換ロジック ─────────────────────────────────────────────────────
function fitSheetToA4(ws) {
  const ref = ws['!ref'];
  if (!ref) return;

  const range  = XLSX.utils.decode_range(ref);
  const nCols  = range.e.c + 1;
  const nRows  = range.e.r + 1;
  const rawCols = ws['!cols'] || [];
  const rawRows = ws['!rows'] || [];

  // 列幅を取得（SheetJSはxml <col min-max>を展開済み）
  const colWidths = Array.from({length: nCols}, (_, i) => {
    const c = rawCols[i] || {};
    const w = c.wch || c.width;
    return (w && w > 0) ? w : DEFAULT_COL_W;
  });

  // 行高さを取得
  const rowHeights = Array.from({length: nRows}, (_, i) => {
    const r = rawRows[i] || {};
    const h = r.hpt;
    return (h && h > 0) ? h : DEFAULT_ROW_H;
  });

  const targetWPx = A4_W_CM / 2.54 * DPI * OVERSHOOT;
  const targetHPx = A4_H_CM / 2.54 * DPI * OVERSHOOT;

  // 時間列ブーストを適用して列幅スケール計算
  const boosted   = colWidths.map((w, i) => TIME_COLS.has(i + 1) ? w * TIME_BOOST : w);
  const totalWPx  = boosted.reduce((s, w) => s + w, 0) * PX_PER_COL_UNIT;
  const scaleW    = targetWPx / totalWPx;
  ws['!cols'] = boosted.map(w => ({ wch: w * scaleW }));

  // 最頻値の行高さ = 日付行として DATE_BOOST 優先
  const counts = {};
  rowHeights.forEach(h => counts[h] = (counts[h] || 0) + 1);
  const modalH  = +Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
  const isData  = rowHeights.map(h => Math.abs(h - modalH) < 0.1);
  const dataSum  = rowHeights.reduce((s, h, i) =>  isData[i] ? s + h : s, 0);
  const otherSum = rowHeights.reduce((s, h, i) => !isData[i] ? s + h : s, 0);
  const targetHPt = targetHPx / PX_PER_ROW_PT;
  const Rd = targetHPt / (dataSum + otherSum / DATE_BOOST);
  const Rn = Rd / DATE_BOOST;
  ws['!rows'] = rowHeights.map((h, i) => ({ hpt: h * (isData[i] ? Rd : Rn) }));

  // 指定セルを空白化
  CELLS_TO_CLEAR.forEach(coord => {
    const cell = ws[coord];
    if (cell) { delete cell.f; cell.v = ''; cell.t = 's'; }
  });

  // ページ設定
  ws['!pageSetup'] = {
    paperSize:   9,
    orientation: 'portrait',
    fitToWidth:  1,
    fitToHeight: 1,
  };
  ws['!margins'] = {
    left:   MARGIN_CM / 2.54,
    right:  MARGIN_CM / 2.54,
    top:    MARGIN_CM / 2.54,
    bottom: MARGIN_CM / 2.54,
    header: 0,
    footer: 0,
  };
  // fitToPage フラグ（sheetProperties/pageSetUpPr）
  if (!ws['!sheetPr']) ws['!sheetPr'] = {};
  ws['!sheetPr'].pageSetUpPr = { fitToPage: true };
}

// ── UI ───────────────────────────────────────────────────────────────
const fileInput = document.getElementById('fileInput');
const dropZone  = document.getElementById('dropZone');
const fileName  = document.getElementById('fileName');
const submitBtn = document.getElementById('submitBtn');
const errorMsg  = document.getElementById('errorMsg');

let selectedFile = null;

function handleFile(file) {
  if (!file) return;
  if (!/\.(xlsx|xlsm)$/i.test(file.name)) {
    errorMsg.textContent = 'Excelファイル (.xlsx) のみ対応しています';
    return;
  }
  selectedFile = file;
  fileName.textContent = file.name;
  submitBtn.disabled = false;
  errorMsg.textContent = '';
}

fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

submitBtn.addEventListener('click', () => {
  if (!selectedFile) return;
  submitBtn.disabled  = true;
  submitBtn.textContent = '変換中...';
  errorMsg.textContent  = '';

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'array', cellStyles: true, sheetStubs: true });
      wb.SheetNames.forEach(name => fitSheetToA4(wb.Sheets[name]));

      const out  = XLSX.write(wb, { bookType: 'xlsx', type: 'array', cellStyles: true });
      const blob = new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = selectedFile.name.replace(/\.[^.]+$/, '') + '_手書き用.xlsx';
      a.click();
      URL.revokeObjectURL(url);
    } catch (err) {
      errorMsg.textContent = 'エラーが発生しました: ' + err.message;
    }
    submitBtn.disabled    = false;
    submitBtn.textContent = 'A4サイズに変換してダウンロード';
  };
  reader.readAsArrayBuffer(selectedFile);
});
</script>
</body>
</html>
