<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Excel 手書き用変換</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, 'Hiragino Sans', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      padding: 40px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 { font-size: 20px; color: #1a202c; margin-bottom: 8px; }

    .desc {
      color: #718096;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      background: #ebf8ff;
      color: #2b6cb0;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 16px;
    }

    /* ローディングバー */
    .loading-bar {
      width: 100%;
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      margin-bottom: 10px;
      overflow: hidden;
    }
    .loading-bar-inner {
      height: 100%;
      background: #4299e1;
      border-radius: 2px;
      width: 0%;
      transition: width 0.4s ease;
    }
    .loading-msg {
      font-size: 13px;
      color: #718096;
      margin-bottom: 20px;
      min-height: 20px;
    }

    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 48px 24px;
      cursor: pointer;
      transition: all 0.2s;
      background: #f7fafc;
      position: relative;
    }

    .drop-zone.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .drop-zone:hover:not(.disabled), .drop-zone.dragover {
      border-color: #4299e1;
      background: #ebf8ff;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-zone .icon  { font-size: 52px; margin-bottom: 14px; }
    .drop-zone .label { color: #4a5568; font-size: 15px; font-weight: 500; }
    .drop-zone .hint  { color: #a0aec0; font-size: 13px; margin-top: 6px; }

    .file-name {
      margin-top: 12px;
      font-size: 14px;
      color: #2b6cb0;
      font-weight: 500;
      min-height: 22px;
      word-break: break-all;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 15px;
      background: #4299e1;
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover    { background: #3182ce; }
    .btn:disabled { background: #a0aec0; cursor: not-allowed; }

    .info-box {
      margin-top: 24px;
      background: #f7fafc;
      border-radius: 10px;
      padding: 14px 16px;
      text-align: left;
      font-size: 13px;
      color: #4a5568;
      line-height: 1.8;
    }

    .info-box strong { color: #2d3748; }

    .error {
      margin-top: 12px;
      color: #e53e3e;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="badge">自動 A4 フィット</div>
  <h1>Excel 手書き用変換</h1>
  <p class="desc">
    アップロードするだけで、セルのサイズを<br>
    <strong>A4用紙いっぱい</strong>になるよう自動で調整します。<br>
    レイアウトや構成はそのまま維持されます。
  </p>

  <div class="loading-bar"><div class="loading-bar-inner" id="loadBar"></div></div>
  <div class="loading-msg" id="loadMsg">Python環境を準備中... (初回のみ30秒ほどかかります)</div>

  <div class="drop-zone disabled" id="dropZone">
    <input type="file" id="fileInput" accept=".xlsx,.xlsm" disabled>
    <div class="icon">📊</div>
    <div class="label">クリックまたはドラッグ＆ドロップ</div>
    <div class="hint">.xlsx ファイルに対応</div>
  </div>
  <div class="file-name" id="fileName"></div>

  <button class="btn" id="submitBtn" disabled>A4サイズに変換してダウンロード</button>
  <div class="error" id="errorMsg"></div>

  <div class="info-box">
    <strong>自動で行うこと</strong><br>
    ・縦横の比率を維持したままセルを拡大<br>
    ・縦向き A4 固定・用紙いっぱいに収める<br>
    ・開始時間・終了時間の列を広めに調整<br>
    ・ファイル名に「_手書き用」を追加して保存
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
<script>
const PYTHON_CODE = `
import io, openpyxl
from openpyxl.utils import get_column_letter
from collections import Counter

MARGIN_CM     = 0.5
A4_PORTRAIT_W = 21.0 - 2 * MARGIN_CM
A4_PORTRAIT_H = 29.7 - 2 * MARGIN_CM
DPI           = 96.0
PX_PER_COL_UNIT = 64.0 / 8.43
PX_PER_ROW_PT   = DPI / 72.0
DEFAULT_COL_WIDTH  = 8.43
DEFAULT_ROW_HEIGHT = 15.0

def build_col_width_map(ws):
    widths = {}
    default = ws.sheet_format.defaultColWidth or DEFAULT_COL_WIDTH
    for dim in ws.column_dimensions.values():
        for col_idx in range(dim.min, dim.max + 1):
            widths[col_idx] = dim.width if (dim.width and dim.width > 0) else default
    return widths

def build_row_height_map(ws):
    heights = {}
    for row_num, dim in ws.row_dimensions.items():
        heights[row_num] = dim.height if (dim.height and dim.height > 0) else DEFAULT_ROW_HEIGHT
    return heights

def fit_sheet_to_a4(ws):
    n_cols = ws.max_column or 1
    n_rows = ws.max_row or 1
    col_map = build_col_width_map(ws)
    row_map = build_row_height_map(ws)
    col_widths  = [col_map.get(c, DEFAULT_COL_WIDTH)  for c in range(1, n_cols + 1)]
    row_heights = [row_map.get(r, DEFAULT_ROW_HEIGHT) for r in range(1, n_rows + 1)]

    OVERSHOOT = 1.10
    target_w_px = A4_PORTRAIT_W / 2.54 * DPI * OVERSHOOT
    target_h_px = A4_PORTRAIT_H / 2.54 * DPI * OVERSHOOT

    TIME_COL_BOOST = 1.5
    TIME_COLS = set(range(14, 22))
    boosted = [w * TIME_COL_BOOST if (i + 1) in TIME_COLS else w for i, w in enumerate(col_widths)]

    total_w_px = sum(boosted) * PX_PER_COL_UNIT
    scale_w = target_w_px / total_w_px
    for col_num, w in enumerate(boosted, 1):
        ws.column_dimensions[get_column_letter(col_num)].width = w * scale_w

    # ヘッダー/フッターを均一スケール、日付データ行（12〜42）で残り高さをすべて使う
    target_h_pt = target_h_px / PX_PER_ROW_PT

    HEADER_END = 11
    DATA_START = 12
    DATA_END = min(42, n_rows)

    header_h = [row_heights[r - 1] for r in range(1, HEADER_END + 1) if r <= n_rows]
    data_h   = [row_heights[r - 1] for r in range(DATA_START, DATA_END + 1) if r <= n_rows]
    footer_h = [row_heights[r - 1] for r in range(DATA_END + 1, n_rows + 1)]

    total_raw_h = sum(header_h) + sum(data_h) + sum(footer_h)
    base_scale = target_h_pt / total_raw_h if total_raw_h > 0 else 1.0

    remaining = target_h_pt - sum(header_h) * base_scale - sum(footer_h) * base_scale
    data_scale = remaining / sum(data_h) if sum(data_h) > 0 else base_scale

    for row_num in range(1, HEADER_END + 1):
        if row_num <= n_rows:
            ws.row_dimensions[row_num].height = row_heights[row_num - 1] * base_scale

    for row_num in range(DATA_START, DATA_END + 1):
        if row_num <= n_rows:
            ws.row_dimensions[row_num].height = row_heights[row_num - 1] * data_scale

    for row_num in range(DATA_END + 1, n_rows + 1):
        ws.row_dimensions[row_num].height = row_heights[row_num - 1] * base_scale

    # データ行（12〜42）の入力済みフィールドを消去
    for row in range(12, 43):
        for col in ['N', 'R', 'AE', 'AZ', 'BH']:  # 開始時間, 終了時間, 食事提供加算, 移行準備支援体制加算, 備考
            ws[f'{col}{row}'].value = None

    # 合計回数: 数式を消して「回」だけ残す
    for coord in ['V43','Z43','AE43','AH43','AK43','AN43','AQ43','AT43','AW43']:
        ws[coord].value = '回'
    # 移行準備支援体制加算: 当月のみ消去（累計BH44は残す）
    ws['BH43'].value = None
    # 当月算定日数
    ws['AZ46'].value = None

    ws.page_setup.paperSize   = ws.PAPERSIZE_A4
    ws.page_setup.orientation = ws.ORIENTATION_PORTRAIT
    ws.sheet_properties.pageSetUpPr.fitToPage = True
    ws.page_setup.fitToWidth  = 1
    ws.page_setup.fitToHeight = 1
    margin_inch = MARGIN_CM / 2.54
    ws.page_margins.top    = margin_inch
    ws.page_margins.bottom = margin_inch
    ws.page_margins.left   = margin_inch
    ws.page_margins.right  = margin_inch
    ws.page_margins.header = 0
    ws.page_margins.footer = 0

def process_file(data):
    wb = openpyxl.load_workbook(io.BytesIO(bytes(data)))
    for ws in wb.worksheets:
        fit_sheet_to_a4(ws)
    out = io.BytesIO()
    wb.save(out)
    return list(out.getvalue())
`;

// ── UI 要素 ──────────────────────────────────────────────────────────
const loadBar   = document.getElementById('loadBar');
const loadMsg   = document.getElementById('loadMsg');
const dropZone  = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileName  = document.getElementById('fileName');
const submitBtn = document.getElementById('submitBtn');
const errorMsg  = document.getElementById('errorMsg');

let pyodide    = null;
let selectedFile = null;

function setLoading(pct, msg) {
  loadBar.style.width = pct + '%';
  loadMsg.textContent = msg;
}

// ── Pyodide 初期化 ───────────────────────────────────────────────────
(async () => {
  try {
    setLoading(10, 'Python環境を準備中... (初回のみ30秒ほどかかります)');
    pyodide = await loadPyodide();

    setLoading(50, 'openpyxlをインストール中...');
    await pyodide.loadPackage('micropip');
    await pyodide.runPythonAsync(`
import micropip
await micropip.install('openpyxl')
    `);

    setLoading(90, 'コードを読み込み中...');
    await pyodide.runPythonAsync(PYTHON_CODE);

    setLoading(100, '準備完了');
    setTimeout(() => { loadMsg.textContent = ''; loadBar.style.display = 'none'; }, 800);

    dropZone.classList.remove('disabled');
    fileInput.disabled = false;
  } catch (e) {
    setLoading(100, '');
    errorMsg.textContent = '初期化に失敗しました: ' + e.message;
  }
})();

// ── ファイル選択 ─────────────────────────────────────────────────────
function handleFile(file) {
  if (!file) return;
  if (!/\.(xlsx|xlsm)$/i.test(file.name)) {
    errorMsg.textContent = 'Excelファイル (.xlsx) のみ対応しています';
    return;
  }
  selectedFile = file;
  fileName.textContent = file.name;
  submitBtn.disabled = false;
  errorMsg.textContent = '';
}

fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));
dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', ()  => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

// ── 変換・ダウンロード ────────────────────────────────────────────────
submitBtn.addEventListener('click', async () => {
  if (!selectedFile || !pyodide) return;
  submitBtn.disabled    = true;
  submitBtn.textContent = '変換中...';
  errorMsg.textContent  = '';

  try {
    const buffer = await selectedFile.arrayBuffer();
    const data   = Array.from(new Uint8Array(buffer));

    pyodide.globals.set('_input_data', pyodide.toPy(data));
    const result = await pyodide.runPythonAsync('process_file(_input_data)');
    const bytes  = new Uint8Array(result.toJs());

    const blob = new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = selectedFile.name.replace(/\.[^.]+$/, '') + '_手書き用.xlsx';
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    errorMsg.textContent = 'エラーが発生しました: ' + e.message;
  }

  submitBtn.disabled    = false;
  submitBtn.textContent = 'A4サイズに変換してダウンロード';
});
</script>
</body>
</html>
